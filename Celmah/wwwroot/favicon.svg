<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- E shape built from rects for crisp rendering -->
  <!-- Vertical bar -->
  <rect x="6" y="5" width="5" height="22" rx="1" fill="url(#letter)"/>
  <!-- Top bar -->
  <rect x="6" y="5" width="20" height="5" rx="1" fill="url(#letter)"/>
  <!-- Middle bar -->
  <rect x="6" y="13.5" width="15" height="4" rx="1" fill="url(#letter)"/>
  <!-- Bottom bar -->
  <rect x="6" y="22" width="20" height="5" rx="1" fill="url(#letter)"/>
  <!-- Error notification dot -->
  <circle cx="27" cy="5.5" r="4" fill="#ffc107"/>
  <circle cx="27" cy="5.5" r="3" fill="#ffdd57" opacity="0.6"/>
</svg>
