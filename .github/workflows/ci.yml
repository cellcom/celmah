name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: SPA Install
        working-directory: Celmah/ui
        run: bun install --frozen-lockfile

      - name: SPA Build
        working-directory: Celmah/ui
        run: bun run build

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Dotnet Restore
        run: dotnet restore

      - name: Nuget markdown files
        uses: devlooped/actions-include@v1

      - name: Dotnet Build
        run: dotnet build --configuration Release --no-restore

      - name: Dotnet Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Dotnet Pack
        run: dotnet pack --configuration Release --no-build

      - name: Upload nuget packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/package/release

  # Publishing to nuget.org is disabled for now. To enable: remove the `if: false`
  # line below and add the NUGET_APIKEY repository secret.
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: false # ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages

      - name: Nuget Push
        run: |
          dotnet nuget push "*.nupkg" --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
